<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0A66C2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6A5ACD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A66C2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6A5ACD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A66C2;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="260" fill="#0D1117" rx="12"/>

  <!-- Main horizontal line -->
  <line x1="80" y1="130" x2="820" y2="130" stroke="url(#grad1)" stroke-width="4" stroke-linecap="round"/>

  <!-- SEC segment (Feb 2025 - Mar 2026) - blue -->
  <line x1="80" y1="130" x2="340" y2="130" stroke="#0A66C2" stroke-width="6" stroke-linecap="round"/>

  <!-- SECTI segment (Feb 2026 - Sep 2026) - purple -->
  <line x1="340" y1="130" x2="600" y2="130" stroke="#6A5ACD" stroke-width="6" stroke-linecap="round"/>

  <!-- SEC current segment (Sep 2026 - now) - green -->
  <line x1="600" y1="130" x2="820" y2="130" stroke="#00cc66" stroke-width="6" stroke-linecap="round"/>

  <!-- Arrow at end -->
  <polygon points="820,125 835,130 820,135" fill="#00cc66"/>

  <!-- Dot 1 - Start SEC -->
  <circle cx="80" cy="130" r="12" fill="#0A66C2" filter="url(#shadow)"/>
  <circle cx="80" cy="130" r="6" fill="#fff"/>

  <!-- Dot 2 - SEC/SECTI transition -->
  <circle cx="340" cy="130" r="12" fill="#6A5ACD" filter="url(#shadow)"/>
  <circle cx="340" cy="130" r="6" fill="#fff"/>

  <!-- Dot 3 - SECTI/SEC transition -->
  <circle cx="600" cy="130" r="12" fill="#00cc66" filter="url(#shadow)"/>
  <circle cx="600" cy="130" r="6" fill="#fff"/>

  <!-- Date labels above line -->
  <rect x="35" y="95" width="90" height="24" rx="4" fill="#0A66C2"/>
  <text x="80" y="112" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">03/02/2025</text>

  <rect x="295" y="95" width="90" height="24" rx="4" fill="#6A5ACD"/>
  <text x="340" y="112" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">03/03/2026</text>

  <rect x="555" y="95" width="90" height="24" rx="4" fill="#00cc66"/>
  <text x="600" y="112" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Set/2026</text>

  <rect x="755" y="95" width="80" height="24" rx="4" fill="#00cc66"/>
  <text x="795" y="112" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold">Atual</text>

  <!-- Cards below -->
  <!-- Card 1 - SEC -->
  <rect x="20" y="155" width="190" height="90" rx="8" fill="#161B22" stroke="#0A66C2" stroke-width="2" filter="url(#shadow)"/>
  <text x="115" y="178" text-anchor="middle" fill="#0A66C2" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SEC/BA</text>
  <text x="115" y="196" text-anchor="middle" fill="#8B949E" font-family="Arial, sans-serif" font-size="9">Sec. da Educação do Estado da Bahia</text>
  <text x="115" y="212" text-anchor="middle" fill="#58A6FF" font-family="monospace" font-size="10">Desenvolvedor Full Stack</text>
  <text x="115" y="232" text-anchor="middle" fill="#8B949E" font-family="Arial, sans-serif" font-size="9">~13 meses</text>

  <!-- Card 2 - SECTI -->
  <rect x="250" y="155" width="220" height="90" rx="8" fill="#161B22" stroke="#6A5ACD" stroke-width="2" filter="url(#shadow)"/>
  <text x="360" y="178" text-anchor="middle" fill="#6A5ACD" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SECTI/BA</text>
  <text x="360" y="196" text-anchor="middle" fill="#8B949E" font-family="Arial, sans-serif" font-size="9">Sec. de Ciência, Tecnologia e Inovação</text>
  <text x="360" y="212" text-anchor="middle" fill="#A78BFA" font-family="monospace" font-size="10">Desenvolvedor Full Stack</text>
  <text x="360" y="232" text-anchor="middle" fill="#8B949E" font-family="Arial, sans-serif" font-size="9">~8 meses</text>

  <!-- Card 3 - SEC (current) -->
  <rect x="510" y="155" width="230" height="90" rx="8" fill="#161B22" stroke="#00cc66" stroke-width="2" filter="url(#shadow)"/>
  <text x="625" y="178" text-anchor="middle" fill="#00cc66" font-family="Arial, sans-serif" font-size="14" font-weight="bold">SEC/BA</text>
  <text x="625" y="196" text-anchor="middle" fill="#8B949E" font-family="Arial, sans-serif" font-size="9">Sec. da Educação do Estado da Bahia</text>
  <text x="625" y="212" text-anchor="middle" fill="#58A6FF" font-family="monospace" font-size="10">Desenvolvedor Full Stack</text>
  <text x="625" y="232" text-anchor="middle" fill="#00cc66" font-family="Arial, sans-serif" font-size="9" font-weight="bold">Atualmente</text>

  <!-- Label: "Linha do Tempo" -->
  <text x="450" y="28" text-anchor="middle" fill="#C9D1D9" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Experiência Institucional</text>
  <line x1="350" y1="35" x2="550" y2="35" stroke="url(#grad1)" stroke-width="2" stroke-linecap="round"/>
</svg>
