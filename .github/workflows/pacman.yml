name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate arcade contribution graphs (pacman, galaga, breakout)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,galaga,breakout'

      # Since Dec 2025 actions run in their own directory by default, so the
      # SVGs land inside the action's checkout instead of the workspace.
      # Copy them into dist/ (the workspace) so the push step can publish them.
      - name: stage SVGs into dist/
        shell: bash
        run: |
          mkdir -p dist
          find "$RUNNER_WORKSPACE/_actions/abozanona/pacman-contribution-graph" -name "*contribution-graph*.svg" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
