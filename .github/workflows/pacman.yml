name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: install arcade renderer
        run: npm install pacman-contribution-graph@5.3.1 --no-audit --no-fund --no-save

      # One process per game: the GitHub GraphQL fetch can hang on a reused
      # keep-alive connection, and a fresh process per render stays reliable.
      - name: render arcade games (dark theme)
        run: |
          mkdir -p dist
          for g in pacman galaga breakout; do
            node scripts/arcade-render.mjs $g github-dark dist/${g}-contribution-graph.svg
          done
          ls -la dist/
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: push SVGs to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          git checkout output
          cp dist/pacman-contribution-graph.svg dist/galaga-contribution-graph.svg dist/breakout-contribution-graph.svg .
          git add pacman-contribution-graph.svg galaga-contribution-graph.svg breakout-contribution-graph.svg
          git diff --staged --quiet || git commit -m "Update arcade games [automated]"
          git push origin output
