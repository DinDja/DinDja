name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "* */12 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # The upstream action renders the light SVG first and then stalls on
      # the dark render, exiting silently. Workaround: one game per run.
      - name: generate pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: stage pacman SVG
        shell: bash
        run: |
          mkdir -p dist
          find "$RUNNER_WORKSPACE/_actions/abozanona/pacman-contribution-graph" -name "pacman-contribution-graph.svg" -exec cp {} dist/ \; 2>/dev/null || true

      - name: generate galaga
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'galaga'

      - name: stage galaga SVG
        shell: bash
        run: |
          find "$RUNNER_WORKSPACE/_actions/abozanona/pacman-contribution-graph" -name "galaga-contribution-graph.svg" -exec cp {} dist/ \; 2>/dev/null || true

      - name: generate breakout
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'breakout'

      - name: stage breakout SVG
        shell: bash
        run: |
          find "$RUNNER_WORKSPACE/_actions/abozanona/pacman-contribution-graph" -name "breakout-contribution-graph.svg" -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: push SVGs to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          git checkout output
          cp dist/*.svg .
          git add pacman-contribution-graph.svg galaga-contribution-graph.svg breakout-contribution-graph.svg
          git diff --staged --quiet || git commit -m "Update arcade games [automated]"
          git push origin output
